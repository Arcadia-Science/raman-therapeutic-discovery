[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rs-tick-lipids"
version = "0.1.0"
description = "Raman spectroscopy may assist natural therapeutic discovery"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arcadia-pycolor==0.6.5",
    "cvxopt==1.3.2",
    "jupyter==1.1.1",
    "numpy==2.4.2",
    "pandas==3.0.0",
    "plotly==6.5.2",
    "ramanspy==0.2.10",
]

[tool.hatch.build.targets.wheel]
packages = ["raman_analysis"]

[tool.ruff]
# The directories to consider when resolving first- vs. third-party imports.
src = ["."]
line-length = 100
indent-width = 4
extend-include = ["*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# Ignore star and unused imports.
"__init__.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
order-by-type = true
no-lines-before = ["future", "standard-library"]

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "W",  # pycodestyle warning
]